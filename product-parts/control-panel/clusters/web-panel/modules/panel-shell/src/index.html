<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Workflow Kit" />
    <title>Workflow Kit</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="controls.css" />
    <link rel="stylesheet" href="provider-cards/provider-cards.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Workflow Kit</h1>
      </div>
      <div class="meta">
        <span class="badge" id="meta-version" title="Версия">—</span>
        <span class="badge" id="meta-os" title="Операционная система">—</span>
        <span class="link-status" id="link-status" data-state="pending" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span><span class="link-text">подключение…</span>
        </span>
      </div>
    </header>
    <main class="cards" id="cards" aria-live="polite"></main>
    <noscript><p class="noscript">Для панели нужен JavaScript.</p></noscript>
  </body>
</html>
